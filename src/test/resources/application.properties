# ─── TEST DATABASE ───────────────────────────────────────────────────────────
# All values below are test-only / dummy — safe to commit, no real credentials.
spring.datasource.url=jdbc:h2:mem:catapp-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always

# ─── JWT (test-only key, not used in any real environment) ───────────────────
security.jwt.secret-key=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLXRoaXMtaXMtbG9uZy1lbm91Z2gtZm9yLUhTMjU2
security.jwt.expiration-time=3600000
security.jwt.refresh-time=120000

# ─── MAIL (disabled — no emails sent in tests) ───────────────────────────────
spring.mail.host=localhost
spring.mail.port=25
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# ─── AZURE (dummy values — no real storage connection) ───────────────────────
azure.storage.connection-string=DefaultEndpointsProtocol=https;AccountName=dummy;AccountKey=dGVzdA==;EndpointSuffix=core.windows.net
azure.storage.container-name=test

# ─── SUPPRESS CONFIG IMPORT ERROR ────────────────────────────────────────────
spring.config.import=optional:file:.env[.properties]
